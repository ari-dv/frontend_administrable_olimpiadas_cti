<div class="layout-wrapper" [class.menu-collapsed]="isMenuCollapsed">
  
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">M</div>
      <span class="text">Olimpiadas CTI</span>
    </div>
    
    <nav class="menu">
      <a routerLink="/inicio" routerLinkActive="active" class="submenu-item">
        <i class="pi pi-th-large"></i> <span class="text">Inicio</span>
      </a>
      
      <div class="menu-section">
        <div class="menu-title">
          <i class="pi pi-graduation-cap"></i> <span class="text">Académico</span>
        </div>
        <a routerLink="/cursos" routerLinkActive="active" class="submenu-item">
          <i class="pi pi-book"></i> <span class="text">Cursos</span>
        </a>
        <a routerLink="/estudiantes" routerLinkActive="active" class="submenu-item">
          <i class="pi pi-users"></i> <span class="text">Estudiantes</span>
        </a>
        <a routerLink="/inscripciones" routerLinkActive="active" class="submenu-item">
          <i class="pi pi-file-edit"></i> <span class="text">Inscripciones</span>
        </a>
      </div>
    </nav>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <i class="pi pi-bars btn-menu" (click)="toggleMenu()"></i>
      <div class="topbar-right">
        <div class="date-badge">{{ fechaActual }}</div>
        <i class="pi pi-bell icon-bell"></i>
      </div>
    </header>

    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
